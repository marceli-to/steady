name: Steady
options:
  bundleIdPrefix: to.marceli
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 3TWRBP96AK   # personal team; change for the studio account
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  SteadyKit:
    path: Packages/SteadyKit

targets:
  Steady:
    type: application
    platform: iOS
    sources:
      - path: Steady
        excludes:
          - "**/*.txt"
      - path: Steady/Resources/Fonts
        includes: ["*.txt"]
        buildPhase: resources
    dependencies:
      - package: SteadyKit
    entitlements:
      path: Steady/Steady.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Steady/Info.plist
      properties:
        CFBundleDisplayName: steady
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Ground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Manrope-Regular.ttf
          - Manrope-Medium.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-Bold.ttf
        NSHealthShareUsageDescription: "steady reads your steps, walking distance and flights climbed to show how far everyday life has carried you. Nothing leaves your phone."
        UIRequiredDeviceCapabilities:
          - healthkit
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.marceli.steady.dev
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Accent

  SteadyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SteadyTests]
    dependencies:
      - target: Steady
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: to.marceli.steady.dev.tests

schemes:
  Steady:
    build:
      targets:
        Steady: all
        SteadyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SteadyTests
        - package: SteadyKit/SteadyKitTests
